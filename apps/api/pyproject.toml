[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs awaits inside greenlets
