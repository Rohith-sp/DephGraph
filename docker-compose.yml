services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dephgraph
      POSTGRES_PASSWORD: dephgraph
      POSTGRES_DB: dephgraph
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dephgraph -d dephgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: seed an empty DB (schema comes from the initdb mount above) and mint the dev token.
  init:
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    image: dephgraph-api
    command: ["python", "../../scripts/docker_init.py"]
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://dephgraph:dephgraph@postgres:5432/dephgraph
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      # Dev-only defaults; override via env / .env for anything shared.
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:-dev-only-cron-secret}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      TRUSTED_PROXY_HOPS: "0"
    volumes:
      - shared:/shared
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: *api-build
    image: dephgraph-api
    environment: *api-env
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - hf_cache:/hf-cache
    depends_on:
      init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Local mode: no Supabase; the server attaches the init-minted dev JWT to API calls.
    environment:
      AUTH_DISABLED: "true"
      API_URL: http://api:8000
    command: ["sh", "-c", "DEV_API_TOKEN=$$(cat /shared/dev_token) exec node apps/web/server.js"]
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes:
      - shared:/shared:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  shared:
  hf_cache:
