services:
  postgres:
    image: postgres:15.19-alpine
    environment:
      POSTGRES_USER: dephgraph
      POSTGRES_PASSWORD: dephgraph
      POSTGRES_DB: dephgraph
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dephgraph -d dephgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0.45
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply pending migrations (scripts/migrate.py), seed an empty DB, mint the dev token.
  init:
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    pull_policy: build  # never pull: images are built locally; no `image:` so names stay per project
    restart: "no"
    command: ["python", "../../scripts/docker_init.py"]
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://dephgraph:dephgraph@postgres:5432/dephgraph
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      # Dev-only defaults; override via env / .env for anything shared.
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:-dev-only-cron-secret}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      TRUSTED_PROXY_HOPS: "0"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # The web server calls the API from one IP, so every dashboard visitor shares this bucket.
      RATE_LIMIT: ${RATE_LIMIT:-600/minute}
    volumes:
      - shared:/shared
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: *api-build
    pull_policy: build
    restart: unless-stopped
    environment: *api-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  # One-shot clustering job (needs the ML image, ~2.3 GB): docker compose --profile ml run --rm cluster
  cluster:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: cluster
    pull_policy: build
    restart: "no"
    environment: *api-env
    volumes:
      - hf_cache:/hf-cache
    depends_on:
      init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Local mode: no Supabase; the server attaches the init-minted dev JWT to API calls.
    environment:
      AUTH_DISABLED: "true"
      API_URL: http://api:8000
    command: ["sh", "-c", "DEV_API_TOKEN=$$(cat /shared/dev_token) exec node apps/web/server.js"]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes:
      - shared:/shared:ro
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  shared:
  hf_cache:
