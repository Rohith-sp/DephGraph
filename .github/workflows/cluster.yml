name: Cluster
# Semantic clustering (SBERT + UMAP + HDBSCAN) runs here, not in the API: Vercel's Python function
# has no room for torch and cannot work after its response. POST /clusters/recompute dispatches this.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cluster
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'dephgraph' }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      FORK: ${{ github.event.repository.fork }}
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$MONGO_URI" ] || [ -z "$REDIS_URL" ]; then
            if [ "$FORK" = "true" ]; then
              echo "::notice::secrets not set on a fork; skipping clustering."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::DATABASE_URL, MONGO_URI or REDIS_URL secret is not set"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.cfg.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.cfg.outputs.run == 'true'
        with: { python-version: "3.12", cache: "pip", cache-dependency-path: "apps/api/requirements*.txt" }
      # CPU wheel: the default one downloads ~2.5 GB of CUDA libraries
      - name: Install dependencies
        if: steps.cfg.outputs.run == 'true'
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/api/requirements-ml.txt
      - uses: actions/cache@v6
        if: steps.cfg.outputs.run == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Run clustering
        if: steps.cfg.outputs.run == 'true'
        working-directory: apps/api
        run: python -m app.jobs.cluster
