# Weekly dependency updates, one grouped PR per ecosystem. Security advisories open their own PRs
# regardless of the schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose: { patterns: ["*"] }
